[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-contracts"
version = "0.1.0"
description = "Versioned event contracts for the FactoryPulse reference platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Falcon"}]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
factorypulse-contracts = "factorypulse_contracts.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorypulse_contracts = ["schemas/*.json"]
